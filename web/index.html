<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inhotim route planner</title>
<meta name="description" content="Plan your walk through Inhotim: the shortest route through what you want to see, built from the museum's public map. An independent project.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e110f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.css"
  integrity="sha512-KIMsMWIdnoG9OwZa+oaIafmbDonqck1UCmq+/zcUi2aaZ97N9QE6TqpTM+n36EO40HGh64hU/375zxtjx7WTyQ=="
  crossorigin="anonymous">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.js"
  integrity="sha512-rOFgoUgWaVi69JW1dzBu6PWF9xKW9rxYfY5u2SexFABHhWk0qUWkJoWNz4UuZRMvSXsNZG66+tU5B+HlwWF5kA=="
  crossorigin="anonymous" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<aside class="sheet" aria-labelledby="title">
  <button id="sheet" class="sheet__handle" type="button" aria-controls="sheet-body" aria-expanded="true">
    <span class="visually-hidden" id="sheet-label">Show map</span>
  </button>
  <header class="top">
    <h1 id="title" data-i18n="title">Inhotim route planner</h1>
    <button id="lang" class="pill" type="button">PT</button>
  </header>
  <div id="alert" class="alert" role="alert" hidden></div>
  <div id="suggestion" class="suggestion" role="status" hidden></div>
  <section class="hero" aria-live="polite">
    <p id="total" class="hero__total">—</p>
    <p id="meta" class="hero__meta">Loading the park map…</p>
  </section>
  <div id="sheet-body" class="sheet__body">
    <form id="form" class="controls" autocomplete="off">
      <fieldset class="control">
        <legend data-i18n="from">Start from</legend>
        <div id="from" class="segmented">
          <label><input type="radio" name="from" value="gate"><span data-i18n="gate">Entrance</span></label>
          <label><input type="radio" name="from" value="here"><span data-i18n="myLocation">My location</span></label>
        </div>
        <p id="from-note" class="control__note" hidden></p>
      </fieldset>
      <fieldset class="control">
        <legend data-i18n="see">What to see</legend>
        <div id="kinds" class="kinds"></div>
        <button id="customize" class="row-button" type="button" aria-haspopup="dialog" aria-controls="picker">
          <span data-i18n="customize">Customize</span>
          <span id="custom-note" class="row-button__note"></span>
        </button>
      </fieldset>
    </form>
    <h2 class="section-title" data-i18n="route">Route</h2>
    <div id="notices" aria-live="polite"></div>
    <ol id="itinerary" class="list"></ol>
    <section id="seen" class="seen" aria-labelledby="seen-title" hidden>
      <h2 id="seen-title" class="section-title" data-i18n="seenTitle">Seen</h2>
      <ol id="seen-list" class="list"></ol>
      <button id="start-over" class="text-button" type="button" data-i18n="startOver">Start over</button>
    </section>
    <footer class="footer">
      <p><span id="data-date"></span> <span data-i18n="disclaimer">Check opening hours at inhotim.org.br.</span></p>
      <p><span data-i18n="notAffiliated">An independent project, not affiliated with Inhotim.</span>
        <a href="https://github.com/Andreixzc/inhotim-path" data-i18n="sourceCode">Source code</a></p>
      <p id="attribution"></p>
    </footer>
  </div>
</aside>
<main id="map" class="map" aria-label="Map"></main>
<dialog id="picker" class="picker" aria-labelledby="picker-title">
  <div class="picker__top">
    <div>
      <h2 id="picker-title" data-i18n="see">What to see</h2>
      <p id="picker-note" class="picker__note" aria-live="polite"></p>
    </div>
    <button id="picker-done" class="pill" type="button" data-i18n="done">Done</button>
  </div>
  <div class="search picker__search">
    <svg class="search__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="picker-search" type="search" data-i18n-placeholder="searchPlaceholder"
      data-i18n-label="searchPlaceholder" aria-controls="picker-groups" enterkeyhint="search">
  </div>
  <div id="picker-groups" class="picker__groups"></div>
</dialog>
</body>
</html>
